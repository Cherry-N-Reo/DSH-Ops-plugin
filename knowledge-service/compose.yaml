name: dsh-ops-knowledge
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dsh_ops
      POSTGRES_DB: dsh_ops_knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsh_ops -d dsh_ops_knowledge"]
      interval: 5s
      timeout: 3s
      retries: 12
